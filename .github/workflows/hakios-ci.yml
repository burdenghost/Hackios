name: HackiOS CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hakios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-tests:
    name: Payload validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 -m py_compile tools/mkesp.py tools/mkesp-test.py xnuloader/mkpayload.py

      - name: Run ESP and payload regression tests
        run: |
          python3 tools/mkesp-test.py

      - name: Install loader build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build the complete ARM64 UEFI loader
        run: |
          command -v clang
          command -v lld-link
          PLACEHOLDER=1 bash xnuloader/mkidentity.sh
          bash xnuloader/build.sh
          file xnuloader/loader.efi
  workflow-smoke:
    name: Workflow scheduling smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Confirm workflow jobs are scheduled
        run: echo "HackiOS workflow scheduling is operational"
