name: HackiOS CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hakios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-tests:
    name: Payload validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 -m py_compile tools/mkesp.py tools/mkesp-test.py xnuloader/mkpayload.py

      - name: Run ESP and payload regression tests
        run: |
          python3 tools/mkesp-test.py

      - name: Install loader build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build the complete ARM64 UEFI loader
        run: |
          command -v clang
          command -v lld-link
          PLACEHOLDER=1 bash xnuloader/mkidentity.sh
          bash xnuloader/build.sh
          file xnuloader/loader.efi
  qemu-open:
    name: Build XNU and verify open-kernel boot in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      THEOS: ${{ runner.temp }}/theos
      JOBS: "2"
      QEMU_TB_MB: "128"
    steps:
      - name: Check out HackiOS
        uses: actions/checkout@v4

      - name: Install host build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential clang curl flex git lld \
            m4 make perl python3 qemu-efi-aarch64 qemu-system-arm rsync tar xz-utils

      - name: Install Theos Linux toolchain
        env:
          CI: "1"
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"

      - name: Install the exact iPhoneOS 16.5 SDK required by this XNU tree
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"
          ln -s "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include/Availability.h"

      - name: Locate AArch64 UEFI firmware for QEMU
        run: |
          EFI=$(find /usr/share \( -name AAVMF_CODE.fd -o -name QEMU_EFI.fd \) -print -quit)
          VARS=$(find /usr/share \( -name AAVMF_VARS.fd -o -name QEMU_VARS.fd \) -print -quit)
          test -n "$EFI"
          test -n "$VARS"
          echo "QEMU_EFI=$EFI" >> "$GITHUB_ENV"
          echo "QEMU_VARS=$VARS" >> "$GITHUB_ENV"

      - name: Verify toolchain and QEMU
        run: |
          command -v clang
          command -v lld-link
          command -v qemu-system-aarch64
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"
