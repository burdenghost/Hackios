name: HackiOS CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hakios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-tests:
    name: Payload validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 -m py_compile tools/mkesp.py tools/mkesp-test.py xnuloader/mkpayload.py

      - name: Run ESP and payload regression tests
        run: |
          python3 tools/mkesp-test.py

      - name: Install loader build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build the complete ARM64 UEFI loader
        run: |
          command -v clang
          command -v lld-link
          PLACEHOLDER=1 bash xnuloader/mkidentity.sh
          bash xnuloader/build.sh
          file xnuloader/loader.efi
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The SoC, device and UEFI repositories devices/manifest.conf names
        # they are private repositories of their own: a token that can read them, in the secret HAKIOS_SYNC_TOKEN; without it the
        # checks of the reference phone's configuration and the made device pages are skipped, and say so
        env:
          TOKEN: ${{ secrets.HAKIOS_SYNC_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
            python3 tools/hakios-device.py sync
          else
            echo "no HAKIOS_SYNC_TOKEN: only the common repository is checked"
          fi
      - name: Python compiles
        run: |
          git ls-files '*.py' | xargs -r python3 -m py_compile
      - name: Shell scripts parse
        run: |
          git ls-files '*.sh' xl | xargs -r -n1 bash -n
      - name: Scripts that start with #! are executable in git (a Windows commit with a pathspec records 644)
        run: |
          bad=$(git ls-files -s | awk '$1=="100644"{print $4}' | while read -r f; do
            case "$f" in *.sh|*.py|xl) head -c2 "$f" | grep -q '^#!' && echo "$f";; esac; done)
          if [ -n "$bad" ]; then echo "not executable in git (git update-index --chmod=+x):"; echo "$bad"; exit 1; fi
      - name: Makefile help
        run: make help
      - name: Provenance - every binary and blob explained, nothing proprietary, nothing writes to the phone
        run: |
          # The rule of the repository: nothing of Darwin, no pictures of it, no vendor firmware, and a
          # promise that the project boots from RAM and does not write to the phone's storage. Every
          # binary must have a line in tools/provenance.allow saying where it came from.
          # (This replaces two lines of the form `! git ls-files | grep ...`: bash -e does not stop on
          # a negated pipeline, so the first of them could never fail, and a committed screenshot passed.)
          python3 tools/provenance-check.py
      - name: The provenance check itself: what it lets through and what it stops
        run: python3 tools/provenance-test.py
      - name: A run sends only the soc_* values that differ from the kernel's defaults
        run: bash tools/soc-only-changes-test.sh
      - name: Configurations - defconfigs, fragments, the arguments made from them
        run: python3 tools/hakios-config-test.py
      - name: The EFI system partition tree is laid out as the loader looks for it
        run: python3 tools/mkesp-test.py
      - name: The kernel's version string is made as it should be
        run: python3 tools/kernel-version-test.py
      - name: The backup tool only reads, copies exactly, and proves every copy
        run: python3 tools/backup-partitions-test.py
      - name: Saved var archives use the newest intact slot
        run: |
          python3 tools/var-store-read.py selftest
          python3 tools/var-store-read-test.py
      - name: The boot-argument catalogue is read from the source, and is current
        run: |
          python3 tools/boot-args-test.py
          python3 tools/boot-args.py --check
      - name: The drivers are kept by subsystem, every one is in drivers/map, and drivers/*/conf builds each exactly once
        run: python3 tools/drivers-check.py
      - name: The device and SoC repositories hold together, and a device's own drivers reach the kernel
        run: |
          python3 tools/hakios-device.py check
          python3 tools/hakios-device-test.py
      - name: The documentation pages made from the source are current
        run: |
          [ ! -d devices/redwood ] || python3 tools/docs-gen.py --check
          python3 tools/docs-check.py
      - name: The Metal plug-in's reading of a .metallib refuses every file cut short or bent (sanitizers)
        run: sh tools/metallib-test.sh
      - name: The kernel patch applies to Apple's tree
        run: |
          git clone -q --depth 1 --branch xnu-8796.121.2 https://github.com/apple-oss-distributions/xnu.git /tmp/xnu
          git -C /tmp/xnu apply --check "$PWD/xnu/hakios.patch"
      - name: APFS tools self-test
        run: |
          [ -x tools/apfs/run-tests.sh ] && tools/apfs/run-tests.sh || echo "no self-test on this runner"
      - name: SoC args generator reproduces the POCO X5 Pro values
        run: |
          sh tools/soc-args-test.sh
          # ... and finds the AOSS mailbox however a phone's own device tree describes it
          python3 tools/soc-args-test-aoss.py
          python3 tools/soc-args-test-reg.py
          # ... and tools/new-device.py makes a port's directory from a phone's tree, and refuses what it should
          python3 tools/new-device-test.py
  qemu-open:
    name: Build XNU and verify open-kernel boot in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      THEOS: ${{ runner.temp }}/theos
      JOBS: "2"
      QEMU_TB_MB: "128"
    steps:
      - name: Check out HackiOS
        uses: actions/checkout@v4

      - name: Install host build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential clang curl flex git lld \
            m4 make perl python3 qemu-efi-aarch64 qemu-system-arm rsync tar xz-utils

      - name: Install Theos Linux toolchain
        env:
          CI: "1"
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"

      - name: Install the exact iPhoneOS 16.5 SDK required by this XNU tree
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"
          ln -s "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include/Availability.h"

      - name: Locate AArch64 UEFI firmware for QEMU
        run: |
          EFI=$(find /usr/share \( -name AAVMF_CODE.fd -o -name QEMU_EFI.fd \) -print -quit)
          VARS=$(find /usr/share \( -name AAVMF_VARS.fd -o -name QEMU_VARS.fd \) -print -quit)
          test -n "$EFI"
          test -n "$VARS"
          echo "QEMU_EFI=$EFI" >> "$GITHUB_ENV"
          echo "QEMU_VARS=$VARS" >> "$GITHUB_ENV"

      - name: Verify toolchain and QEMU
        run: |
          command -v clang
          command -v lld-link
          command -v qemu-system-aarch64
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"

      - name: Build and boot the Apple-free open kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          set +e
          make qemu-open SECS=90 JOBS="$JOBS" 2>&1 | tee logs/qemu-open.log
          make_status=${PIPESTATUS[0]}
          set -e
          # qemu/run.sh deliberately times out the guest after SECS; a boot is proven by
          # the loader banner, kernel banner, and PID 1's userspace output in the serial log.
          grep -Fq "== XNULOADER v3 ==" logs/qemu-open.log
          grep -Fq "hello hakios-kernel!" logs/qemu-open.log
          grep -Fq "Hello from user space on Darwin!" logs/qemu-open.log
          grep -Fq "kernel.ver=" logs/qemu-open.log
          echo "QEMU open boot reached the loader, kernel, and userspace markers."
          if [ "$make_status" -ne 0 ] && [ "$make_status" -ne 124 ]; then
            echo "make qemu-open returned $make_status after producing the expected boot markers."
          fi

      - name: Boot the same payload from the UEFI FAT volume
        shell: bash
        run: |
          set -euo pipefail
          set +e
          QEMU_ESP=1 qemu/run.sh 90 2>&1 | tee logs/qemu-esp.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          # This second path exercises the loader's own filesystem reader instead of QEMU's
          # memory-loader device. The payload must be found on the EFI volume and reach userspace.
          grep -Fq "== XNULOADER v3 ==" logs/qemu-esp.log
          grep -Fq "payload: " logs/qemu-esp.log
          grep -Fq "payload.bin on the volume this loader was started from" logs/qemu-esp.log
          grep -Fq "hello hakios-kernel!" logs/qemu-esp.log
          grep -Fq "Hello from user space on Darwin!" logs/qemu-esp.log
          grep -Fq "kernel.ver=" logs/qemu-esp.log
          echo "UEFI ESP boot reached the loader, kernel, and userspace markers."
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU returned $qemu_status after producing the expected ESP boot markers."
          fi

      - name: Exercise the loader return-stub self-test
        shell: bash
        run: |
          set -euo pipefail
          # checkpoint=999 is a documented loader self-test: it takes the normal kernel
          # load/boot-args preparation path, then returns through loader_return_stub
          # without entering XNU. This isolates the saved-UEFI-context round trip.
          ARGS_OPEN="$(tools/hakios-config.py args --defconfig defconfig)"
          xnuloader/mkpayload.py -o qemu/payload.bin \
            kernel=hakios-kernel \
            ramdisk=userland/hello \
            --cmdline "$ARGS_OPEN" \
            --checkpoint 999
          set +e
          QEMU_ESP=1 qemu/run.sh 30 2>&1 | tee logs/qemu-return-selftest.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          grep -Fq "payload.bin on the volume this loader was started from" logs/qemu-return-selftest.log
          grep -Fq "return-path self test passed" logs/qemu-return-selftest.log
          echo "UEFI context save/restore return-stub self-test passed."
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU returned $qemu_status after producing the expected self-test marker."
          fi

      - name: Exercise XNU's real loader_return path
        shell: bash
        run: |
          set -euo pipefail
          # Unlike checkpoint=999, this enters XNU. Its early-boot timer calls
          # loader_return(), which must return through the loader's saved UEFI context.
          # One CPU isolates the direct return path from PSCI secondary-core shutdown.
          ARGS_OPEN="$(tools/hakios-config.py args --defconfig defconfig)"
          xnuloader/mkpayload.py -o qemu/payload.bin \
            kernel=hakios-kernel \
            ramdisk=userland/hello \
            --cmdline "$ARGS_OPEN loader_return_after=15"
          set +e
          QEMU_ESP=1 qemu/run.sh 60 2>&1 | tee logs/qemu-xnu-return.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          grep -Fq "payload.bin on the volume this loader was started from" logs/qemu-xnu-return.log
          grep -Fq "kernel returned: log at" logs/qemu-xnu-return.log
          grep -Fq "loader_return_after expired" logs/qemu-xnu-return.log
          grep -Fq "== KERNEL LOG ==" logs/qemu-xnu-return.log
          echo "XNU's timed loader_return completed and the UEFI loader resumed."
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU returned $qemu_status after producing the expected XNU return markers."
          fi

      - name: Exercise multi-core PSCI startup and shutdown before XNU return
        shell: bash
        run: |
          set -euo pipefail
          # Four virtual CPUs and cpus=4 make XNU start three secondary cores through PSCI.
          # The timed orderly return then requires each secondary to report OFF through
          # PSCI AFFINITY_INFO before the boot CPU resumes the UEFI loader.
          ARGS_OPEN="$(tools/hakios-config.py args --defconfig defconfig)"
          xnuloader/mkpayload.py -o qemu/payload.bin \
            kernel=hakios-kernel \
            ramdisk=userland/hello \
            --cmdline "$ARGS_OPEN cpus=4 loader_return_after=15"
          set +e
          QEMU_SMP=4 QEMU_ESP=1 qemu/run.sh 75 2>&1 | tee logs/qemu-psci-smp-return.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          grep -Fq "payload.bin on the volume this loader was started from" logs/qemu-psci-smp-return.log
          for cpu in 1 2 3; do
            grep -Fq "psci: cpu $cpu joined the scheduler" logs/qemu-psci-smp-return.log
            grep -Fq "psci: cpu $cpu stopped (PSCI AFFINITY_INFO=OFF)" logs/qemu-psci-smp-return.log
          done
          grep -Fq "loader_return_after expired" logs/qemu-psci-smp-return.log
          grep -Fq "kernel returned: log at" logs/qemu-psci-smp-return.log
          echo "All three secondary CPUs joined XNU, reported PSCI OFF, and XNU returned to UEFI."
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU returned $qemu_status after producing the expected SMP return markers."
          fi

      - name: Upload boot and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-qemu-open-logs
          path: |
            logs/qemu-open.log
            logs/qemu-esp.log
            logs/qemu-return-selftest.log
            logs/qemu-xnu-return.log
            logs/qemu-psci-smp-return.log
            xnu-build.log
            xnu-deps/*.log
          if-no-files-found: warn
          retention-days: 14
